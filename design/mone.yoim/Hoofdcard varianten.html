<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Hoofdcard · varianten · mone.yoim</title>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="mone-tokens.css">
<style>html,body{color-scheme:light}body{margin:0;font-family:var(--font-sans);background:#e9e8e2!important}a{color:var(--accent)}a:hover{color:var(--accent-hover)}</style>
</head><body><div id="doek"></div>
<script>
const PACE=16/30, DAGEN_REST=14;
const IC={
house:'<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
basket:'<path d="m15 11-1 9"/><path d="m19 11-4-7"/><path d="M2 11h20"/><path d="m3.5 11 1.6 7.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6l1.7-7.4"/><path d="M4.5 15.5h15"/><path d="m5 11 4-7"/><path d="m9 11 1 9"/>',
car:'<path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/>',
utensils:'<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
shirt:'<path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.150a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/>',
dots:'<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
repeat:'<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
sprout:'<path d="M14 9.536V7a4 4 0 0 1 4-4h1.5a.5.5 0 0 1 .5.5V5a4 4 0 0 1-4 4 4 4 0 0 0-4 4c0 2 1 3 1 5a5 5 0 0 1-1 3"/><path d="M4 9a5 5 0 0 1 8 4 5 5 0 0 1-8-4"/><path d="M5 21h14"/>',
chev:'<path d="m9 18 6-6-6-6"/>',pill:'<path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/>',gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/>',coffee:'<path d="M10 2v2"/><path d="M14 2v2"/><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/><path d="M6 2v2"/>',book:'<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',check:'<path d="M20 6 9 17l-5-5"/>',alert:'<circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>',down:'<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>'};
const ico=(n,s=18,w=1.8)=>`<svg xmlns="http://www.w3.org/2000/svg" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:0 0 auto">${IC[n]}</svg>`;
const CATS=[
{n:'Wonen',v:845,c:'blue',i:'house'},
{n:'Boodschappen',v:612.40,c:'green',i:'basket',b:700},
{n:'Vervoer',v:214.60,c:'teal',i:'car'},
{n:'Uit eten',v:141,c:'orange',i:'utensils',b:150},
{n:'Kleding',v:128.50,c:'red',i:'shirt',b:100},
{n:'Overig',v:119.53,c:'gray',i:'dots'},
{n:'Abonnementen',v:64.97,c:'purple',i:'repeat'},
{n:'Tuin',v:58.30,c:'olijf',i:'sprout'}];
const SUM=CATS.reduce((a,c)=>a+c.v,0), GEM=2410;
const BUD=CATS.filter(c=>c.b), REST=CATS.filter(c=>!c.b);
const eur=(v,d=2)=>'€ '+v.toLocaleString('nl-NL',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=c=>Math.round(c.v/SUM*100)+'%';
const st=c=>{const p=c.v/c.b;return p>1?'over':p>PACE+.15?'snel':'ok'};
const stCol=c=>({over:'var(--danger)',snel:'var(--botergoud)',ok:'var(--accent)'})[st(c)];
const stTxt=c=>st(c)==='over'?`${eur(c.v-c.b)} over`:`nog ${eur(c.b-c.v)}`;
const perDag=c=>c.v<c.b?`± ${eur((c.b-c.v)/DAGEN_REST)} per dag`:'budget op';
const cv=c=>`var(--cat-${c.c})`, cbg=c=>`var(--cat-${c.c}-bg)`;

function donut(size,sw,{gap=2,sel=-1,dim=false}={}){const r=(size-sw)/2-(sel>=0?5:0),C=2*Math.PI*r;let acc=0,o='';
CATS.forEach((c,k)=>{const L=c.v/SUM*C;const w=k===sel?sw+10:sw;const op=dim&&sel>=0&&k!==sel?.28:1;
o+=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${cv(c)}" stroke-opacity="${op}" stroke-width="${w}" stroke-dasharray="${Math.max(L-gap,0)} ${C}" stroke-dashoffset="${-acc}" transform="rotate(-90 ${size/2} ${size/2})"/>`;acc+=L});
return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true" style="flex:0 0 auto;display:block">${o}</svg>`}
function ring(size,sw,p,col){const r=(size-sw)/2,C=2*Math.PI*r;return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-sunken)" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${Math.min(p,1)*C} ${C}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`}
function bar(c,h=6,{tick=true,track='var(--surface-sunken)',col}={}){const p=Math.min(c.v/c.b,1)*100;return `<div style="position:relative;height:${h}px;border-radius:999px;background:${track}"><span style="position:absolute;left:0;top:0;bottom:0;width:${p}%;border-radius:999px;background:${col||stCol(c)}"></span>${tick?`<span aria-hidden="true" style="position:absolute;top:-3px;bottom:-3px;left:${PACE*100}%;width:2px;margin-left:-1px;border-radius:1px;background:var(--text);box-shadow:0 0 0 2px var(--surface-raised)"></span>`:''}</div>`}
const card=(x,pad='20px')=>`<div style="display:flex;flex-direction:column;padding:${pad};border-radius:var(--radius-lg);background:var(--surface-raised);border:1px solid var(--border);box-shadow:var(--shadow-card);color:var(--text)">${x}</div>`;
const chip=(c,s=32)=>`<span style="flex:0 0 auto;width:${s}px;height:${s}px;border-radius:999px;display:grid;place-items:center;background:${cbg(c)};color:${cv(c)}">${ico(c.i,s*.5,2)}</span>`;
const dot=c=>`<span style="flex:0 0 auto;width:8px;height:8px;border-radius:999px;background:${cv(c)}"></span>`;
const num='font-variant-numeric:tabular-nums;white-space:nowrap';
const verschil=`<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-hover);font-size:13px;font-weight:600;${num}">${ico('down',13,2.4)}${eur(GEM-SUM,0)} minder</span>`;

const V=[];
/* 1a verfijnd */
V.push({t:'Verfijnd',d:'Huidige opbouw, opgeschoond: totaal in de ring, één rijtype, budget als tweede regel met resterend bedrag.',h:()=>card(
`<div style="display:flex;align-items:center;gap:24px;padding-bottom:18px">
<div style="position:relative">${donut(168,16)}<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px"><span style="font-size:12px;color:var(--text-muted)">september</span><b style="font-size:22px;font-weight:600;letter-spacing:-.02em;${num}">${eur(SUM)}</b></div></div>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;align-items:flex-start"><span style="font-size:13px;color:var(--text-muted)">Rond 16 september geef je gemiddeld</span><b style="font-size:20px;font-weight:600;letter-spacing:-.01em;${num}">${eur(GEM)}</b>${verschil}</div></div>`+
CATS.map((c,k)=>`<div style="display:flex;flex-direction:column;gap:8px;padding:10px 0;border-top:1px solid var(--border)"><div style="display:flex;align-items:center;gap:12px">${chip(c)}<span style="flex:1;min-width:0;font-size:15px">${c.n}</span><span style="font-size:15px;${num}">${eur(c.v)}</span></div>${c.b?`<div style="display:flex;align-items:center;gap:12px;margin-left:44px">${`<div style="flex:1">${bar(c)}</div>`}<span style="flex:0 0 auto;min-width:92px;text-align:right;font-size:13px;font-weight:500;color:${st(c)==='over'?'var(--danger)':'var(--text-muted)'};${num}">${stTxt(c)}</span></div>`:''}</div>`).join(''))});

/* 1b gesplitst */
V.push({t:'Gesplitst',d:'Waar het geld heen gaat bovenin (donut + legenda in twee kolommen), budgetten als eigen blok met tempo-streep en bedrag per dag.',h:()=>card(
`<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px"><div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:13px;color:var(--text-muted)">Uitgegeven in september</span><b style="font-size:30px;font-weight:600;letter-spacing:-.02em;${num}">${eur(SUM)}</b></div>${verschil}</div>
<div style="display:flex;align-items:center;gap:22px;padding:18px 0 20px">${donut(132,14)}<div style="flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 18px">`+
CATS.map(c=>`<div style="display:flex;align-items:center;gap:8px;min-width:0">${dot(c)}<span style="flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.n}</span><span style="font-size:13px;color:var(--text-muted);${num}">${pct(c)}</span></div>`).join('')+`</div></div>
<div style="display:flex;align-items:baseline;justify-content:space-between;padding:16px 0 4px;border-top:1px solid var(--border)"><b style="font-size:15px;font-weight:600">Budgetten</b><span style="font-size:13px;color:var(--text-muted)">dag 16 van 30</span></div>`+
BUD.map((c,k)=>`<div style="display:flex;flex-direction:column;gap:8px;padding:12px 0">
<div style="display:flex;align-items:baseline;gap:8px"><span style="flex:1;font-size:15px;font-weight:500">${c.n}</span><span style="font-size:15px;${num}">${eur(c.v)} <span style="color:var(--text-subtle)">/ ${eur(c.b,0)}</span></span></div>
${bar(c,10)}
<div style="display:flex;justify-content:space-between;font-size:13px;${num}"><span style="color:${st(c)==='over'?'var(--danger)':'var(--text-muted)'};font-weight:${st(c)==='over'?600:400}">${st(c)==='over'?stTxt(c)+' budget':stTxt(c)+' · '+perDag(c)}</span>${k===0?`<span style="color:var(--text-subtle)">streep = vandaag</span>`:''}</div></div>`).join(''))});

/* 1c gestapelde balk */
V.push({t:'Gestapelde balk',d:'Geen donut: één brede balk vervangt hem. Daaronder een tabel met aandeel, budget en bedrag in vaste kolommen.',h:()=>{let acc='';
const seg=CATS.map(c=>`<span style="flex:${c.v} 1 0;height:100%;background:${cv(c)}"></span>`).join('');
const cols='grid-template-columns:minmax(0,1fr) 48px 112px 92px';
return card(`<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px"><div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:13px;color:var(--text-muted)">Uitgegeven in september</span><b style="font-size:34px;font-weight:600;letter-spacing:-.025em;${num}">${eur(SUM)}</b></div><span style="font-size:13px;color:var(--text-muted);text-align:right;${num}">gemiddeld rond nu<br><b style="color:var(--text);font-weight:600">${eur(GEM)}</b></span></div>
<div style="display:flex;gap:2px;height:14px;margin:18px 0 20px;border-radius:999px;overflow:hidden">${seg}</div>
<div style="display:grid;${cols};gap:12px;padding-bottom:8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--text-subtle)"><span>Categorie</span><span style="text-align:right">Deel</span><span>Budget</span><span style="text-align:right">Bedrag</span></div>`+
CATS.map(c=>`<div style="display:grid;${cols};gap:12px;align-items:center;min-height:44px;border-top:1px solid var(--border)"><span style="display:flex;align-items:center;gap:10px;min-width:0">${dot(c)}<span style="font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.n}</span></span><span style="text-align:right;font-size:13px;color:var(--text-muted);${num}">${pct(c)}</span>${c.b?`<span style="display:flex;flex-direction:column;gap:4px"><span style="font-size:12px;color:${st(c)==='over'?'var(--danger)':'var(--text-muted)'};font-weight:500;${num}">${stTxt(c)}</span>${bar(c,4,{tick:false})}</span>`:`<span style="font-size:13px;color:var(--text-subtle)">—</span>`}<span style="text-align:right;font-size:15px;${num}">${eur(c.v)}</span></div>`).join(''))}});

/* 1d ringen */
V.push({t:'Budget-ringen',d:'Budgetten als drie tegels met eigen voortgangsring bovenaan; de rest van de categorieën compact eronder.',h:()=>card(
`<div style="display:flex;align-items:center;gap:20px"><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start"><span style="font-size:13px;color:var(--text-muted)">Uitgegeven in september</span><b style="font-size:30px;font-weight:600;letter-spacing:-.02em;${num}">${eur(SUM)}</b>${verschil}</div>${donut(116,12)}</div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:20px 0 16px">`+
BUD.map(c=>`<div style="display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--radius-lg);background:var(--surface-sunken)"><div style="position:relative;width:56px;height:56px">${ring(56,6,c.v/c.b,stCol(c)).replace('var(--surface-sunken)','var(--surface-raised)')}<span style="position:absolute;inset:0;display:grid;place-items:center;color:${cv(c)}">${ico(c.i,20,2)}</span></div><div style="display:flex;flex-direction:column;gap:2px"><b style="font-size:14px;font-weight:600">${c.n}</b><span style="font-size:13px;${num}">${eur(c.v,0)} <span style="color:var(--text-subtle)">van ${eur(c.b,0)}</span></span><span style="font-size:13px;font-weight:500;color:${st(c)==='over'?'var(--danger)':st(c)==='snel'?'var(--botergoud)':'var(--text-muted)'};${num}">${stTxt(c)}</span></div></div>`).join('')+`</div>
<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:24px">`+
REST.map(c=>`<div style="display:flex;align-items:center;gap:10px;min-height:44px;border-top:1px solid var(--border)">${dot(c)}<span style="flex:1;min-width:0;font-size:14px">${c.n}</span><span style="font-size:14px;${num}">${eur(c.v)}</span></div>`).join('')+`</div>`)});

/* 1e selectie */
V.push({t:'Donut als bediening',d:'Grote donut naast de lijst. Een categorie kiezen licht het segment op en klapt het budget uit; het midden toont het detail.',h:()=>{const s=1,c=CATS[s];return card(
`<div style="display:flex;align-items:baseline;justify-content:space-between;padding-bottom:16px"><span style="font-size:13px;color:var(--text-muted)">Uitgegeven in september</span><b style="font-size:20px;font-weight:600;letter-spacing:-.01em;${num}">${eur(SUM)}</b></div>
<div style="display:flex;gap:18px;align-items:flex-start"><div style="position:relative;flex:0 0 auto">${donut(212,20,{sel:s,dim:true,gap:2})}<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center">${chip(c,36)}<span style="font-size:13px;color:var(--text-muted);margin-top:4px">${c.n}</span><b style="font-size:22px;font-weight:600;letter-spacing:-.02em;${num}">${eur(c.v)}</b><span style="font-size:12px;color:var(--text-subtle)">${pct(c)} van alles</span></div></div>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">`+
CATS.map((x,k)=>k===s?`<div style="display:flex;flex-direction:column;gap:8px;padding:10px;margin:0 -10px;border-radius:var(--radius-sm);background:var(--surface-sunken)"><div style="display:flex;align-items:center;gap:8px">${dot(x)}<span style="flex:1;font-size:14px;font-weight:600">${x.n}</span><span style="font-size:14px;font-weight:600;${num}">${eur(x.v)}</span></div>${bar(x,6,{track:'var(--surface-raised)'})}<span style="font-size:12px;color:var(--text-muted);${num}">${stTxt(x)} van ${eur(x.b,0)} · ${perDag(x)}</span></div>`:`<div style="display:flex;align-items:center;gap:8px;min-height:32px;${k===s+1?'':''}">${dot(x)}<span style="flex:1;min-width:0;font-size:14px;color:var(--text-muted)">${x.n}</span><span style="font-size:14px;${num}">${eur(x.v)}</span>${x.b?`<span title="heeft budget" style="width:6px;height:6px;border-radius:999px;background:${stCol(x)}"></span>`:'<span style="width:6px"></span>'}</div>`).join('')+`</div></div>`)}});

/* 1f halve boog */
V.push({t:'Halve boog + tegels',d:'Halve donut als koptekst met het totaal eronder. Categorieën als tegels; tegels met budget krijgen hun balk onderin.',h:()=>{const W=300,sw=18,r=(W-sw)/2,C=Math.PI*r*2,H=C/2;let acc=0,o='';
CATS.forEach(c=>{const L=c.v/SUM*H;o+=`<circle cx="${W/2}" cy="${W/2}" r="${r}" fill="none" stroke="${cv(c)}" stroke-width="${sw}" stroke-dasharray="${Math.max(L-2,0)} ${C}" stroke-dashoffset="${-acc}" transform="rotate(180 ${W/2} ${W/2})"/>`;acc+=L});
return card(`<div style="position:relative;width:${W}px;height:${W/2+4}px;margin:4px auto 0;overflow:hidden"><svg width="${W}" height="${W}" viewBox="0 0 ${W} ${W}" style="display:block">${o}</svg><div style="position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:6px"><span style="font-size:13px;color:var(--text-muted)">september tot nu</span><b style="font-size:32px;font-weight:600;letter-spacing:-.025em;line-height:1;${num}">${eur(SUM)}</b></div></div>
<div style="display:flex;justify-content:center;padding:12px 0 18px">${verschil}</div>
<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px">`+
CATS.map(c=>`<div style="display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:var(--radius-lg);border:1px solid var(--border)"><div style="display:flex;align-items:center;gap:10px">${chip(c,30)}<span style="flex:1;min-width:0;display:flex;flex-direction:column"><span style="font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.n}</span><span style="font-size:12px;color:var(--text-muted)">${pct(c)}</span></span><span style="font-size:14px;font-weight:500;${num}">${eur(c.v,0)}</span></div>${c.b?`<div style="display:flex;flex-direction:column;gap:5px">${bar(c,5)}<span style="font-size:12px;font-weight:500;color:${st(c)==='over'?'var(--danger)':'var(--text-muted)'};${num}">${stTxt(c)} van ${eur(c.b,0)}</span></div>`:''}</div>`).join('')+`</div>`)}});

/* ronde 2: varianten op 1b */
const over=c=>st(c)==='over';
const kop=(sz=30)=>`<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px"><div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:13px;color:var(--text-muted)">Uitgegeven in september</span><b style="font-size:${sz}px;font-weight:600;letter-spacing:-.02em;${num}">${eur(SUM)}</b></div>${verschil}</div>`;
const ringTot=(s,sw,fs=20)=>`<div style="position:relative;flex:0 0 auto">${donut(s,sw)}<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px"><span style="font-size:12px;color:var(--text-muted)">september</span><b style="font-size:${fs}px;font-weight:600;letter-spacing:-.02em;${num}">${eur(SUM,0)}</b></div></div>`;
const legAmt=(cols=2,fs=13)=>`<div style="flex:1;min-width:0;display:grid;grid-template-columns:repeat(${cols},minmax(0,1fr));gap:10px 18px">`+CATS.map(c=>`<div style="display:flex;align-items:center;gap:8px;min-width:0">${dot(c)}<span style="flex:1;min-width:0;font-size:${fs}px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.n}</span><span style="font-size:${fs}px;color:var(--text-muted);${num}">${eur(c.v,0)}</span></div>`).join('')+`</div>`;
const budKop=(r='dag 16 van 30')=>`<div style="display:flex;align-items:baseline;justify-content:space-between;padding:16px 0 4px;border-top:1px solid var(--border)"><b style="font-size:15px;font-weight:600">Budgetten</b><span style="font-size:13px;color:var(--text-muted)">${r}</span></div>`;
const budBlok=(c,k,bf=bar)=>`<div style="display:flex;flex-direction:column;gap:8px;padding:12px 0"><div style="display:flex;align-items:baseline;gap:8px"><span style="flex:1;font-size:15px;font-weight:500">${c.n}</span><span style="font-size:15px;${num}">${eur(c.v)} <span style="color:var(--text-subtle)">/ ${eur(c.b,0)}</span></span></div>${bf(c,10)}<div style="display:flex;justify-content:space-between;font-size:13px;${num}"><span style="color:${over(c)?'var(--danger)':'var(--text-muted)'};font-weight:${over(c)?600:400}">${over(c)?stTxt(c)+' budget':stTxt(c)+' · '+perDag(c)}</span></div></div>`;
/* tempo-balk: tot 'vandaag' accent, voorsprong in statuskleur, verwacht-zone zichtbaar */
function tbar(c,h=10){const a=Math.min(c.v/c.b,1)*100,e=PACE*100,ok=Math.min(a,e);return `<div style="position:relative;height:${h}px;border-radius:999px;background:var(--surface-sunken);overflow:hidden"><span style="position:absolute;left:0;top:0;bottom:0;width:${e}%;background:repeating-linear-gradient(135deg,var(--border) 0 2px,transparent 2px 6px)"></span><span style="position:absolute;left:0;top:0;bottom:0;width:${ok}%;background:var(--accent)"></span>${a>e?`<span style="position:absolute;top:0;bottom:0;left:${e}%;width:${a-e}%;background:${stCol(c)}"></span>`:''}<span style="position:absolute;top:0;bottom:0;left:${e}%;width:2px;margin-left:-1px;background:var(--surface-raised)"></span></div>`}
const pill=c=>{const s=st(c),m={over:['Over','var(--danger)','var(--cat-red-bg)'],snel:['Te snel','var(--botergoud)','var(--botergoud-soft)'],ok:['Op koers','var(--accent-hover)','var(--accent-soft)']}[s];return `<span style="flex:0 0 auto;padding:2px 8px;border-radius:999px;background:${m[2]};color:${m[1]};font-size:12px;font-weight:600">${m[0]}</span>`};
const V2=[];

`<div style="display:flex;align-items:center;gap:22px;padding-bottom:20px">${ringTot(148,14)}<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:14px">${legAmt()}<div>${verschil}</div></div></div>`+budKop()+BUD.map((c,k)=>budBlok(c,k)).join(''))});

V2.push({t:'Tempo in de balk',d:'Geen losse streep meer: tot vandaag vult de balk in groen, wat je vóór loopt kleurt goud of rood. Gearceerd = waar je nu mag zitten.',h:()=>card(
kop()+`<div style="display:flex;align-items:center;gap:22px;padding:18px 0 20px">${donut(132,14)}${legAmt()}</div>`+budKop('t/m 16 sep')+BUD.map((c,k)=>budBlok(c,k,tbar)).join('')+`<div style="display:flex;gap:16px;padding-top:6px;font-size:12px;color:var(--text-muted)"><span style="display:flex;align-items:center;gap:6px"><span style="width:14px;height:8px;border-radius:2px;background:var(--accent)"></span>op tempo</span><span style="display:flex;align-items:center;gap:6px"><span style="width:14px;height:8px;border-radius:2px;background:var(--botergoud)"></span>vóór op tempo</span><span style="display:flex;align-items:center;gap:6px"><span style="width:14px;height:8px;border-radius:2px;background:var(--danger)"></span>over budget</span></div>`)});
V2.push({t:'Status eerst',d:'Budgetten gesorteerd op urgentie met een statuslabel. Eén zin per budget zegt wat er aan de hand is.',h:()=>{const ord=[...BUD].sort((a,b)=>b.v/b.b-a.v/a.b);return card(
kop()+`<div style="display:flex;align-items:center;gap:22px;padding:18px 0 20px">${donut(132,14)}${legAmt()}</div>`+budKop()+ord.map((c,k)=>`<div style="display:flex;flex-direction:column;gap:8px;padding:12px 0;${k?'border-top:1px solid var(--border)':''}"><div style="display:flex;align-items:center;gap:10px">${chip(c,28)}<span style="flex:1;font-size:15px;font-weight:500">${c.n}</span>${pill(c)}</div><div style="margin-left:38px">${bar(c,6)}</div><span style="margin-left:38px;font-size:13px;color:var(--text-muted);${num}">${over(c)?`${eur(c.v)} van ${eur(c.b,0)}, dus ${eur(c.v-c.b)} erover.`:`${eur(c.v)} van ${eur(c.b,0)}. Nog ${eur(c.b-c.v)}, ${perDag(c)}.`}</span></div>`).join(''))}});
V2.push({t:'Volle breedte',w:1000,d:'Als de card losgetrokken wordt: hoofdcard over de hele breedte, verdeling links en budgetten rechts naast elkaar.',h:()=>card(
`<div style="display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:36px"><div style="display:flex;flex-direction:column;gap:20px">${kop()}<div style="display:flex;align-items:center;gap:24px">${donut(156,15)}${legAmt(1,14).replace('gap:10px 18px','gap:9px 18px')}</div></div><div style="display:flex;flex-direction:column;padding-left:36px;border-left:1px solid var(--border)"><div style="display:flex;align-items:baseline;justify-content:space-between;padding-bottom:4px"><b style="font-size:15px;font-weight:600">Budgetten</b><span style="font-size:13px;color:var(--text-muted)">dag 16 van 30</span></div>`+BUD.map((c,k)=>budBlok(c,k)).join('')+`</div></div>`,'24px')});
V2.push({t:'Kop als vlak',d:'Totaal en verdeling in een zacht ingezonken vlak bovenin; budgetten eronder op het witte deel van de card.',h:()=>card(
`<div style="display:flex;flex-direction:column;gap:18px;padding:18px;border-radius:var(--radius-lg);background:var(--surface-sunken)">${kop(28)}<div style="display:flex;align-items:center;gap:22px">${donut(124,13).replace(/stroke-dasharray/g,'stroke-linecap="butt" stroke-dasharray')}${legAmt()}</div></div><div style="display:flex;align-items:baseline;justify-content:space-between;padding:20px 0 4px"><b style="font-size:15px;font-weight:600">Budgetten</b><span style="font-size:13px;color:var(--text-muted)">dag 16 van 30</span></div>`+BUD.map((c,k)=>budBlok(c,k)).join(''))});

/* ronde 3: losse cards, 7 budgetten van Imke */
const B7=[{n:'Boodschappen',v:612.40,b:700,c:'green',i:'basket'},{n:'Uit eten',v:141,b:150,c:'orange',i:'utensils'},{n:'Kleding',v:128.50,b:100,c:'red',i:'shirt'},{n:'Drogisterij',v:38.20,b:60,c:'gray',i:'pill'},{n:'Cadeaus',v:41,b:50,c:'purple',i:'gift'},{n:'Koffie & lunch',v:34.50,b:80,c:'orange',i:'coffee'},{n:'Hobby',v:12,b:60,c:'olijf',i:'book'}].map(c=>({...c,o:'imke'}));
const B7s=[...B7].sort((a,b)=>b.v/b.b-a.v/a.b);
const av=(p='imke',s=20)=>`<span style="flex:0 0 auto;width:${s}px;height:${s}px;border-radius:999px;background:var(--member-${p});color:#fff;font-size:${Math.round(s*.55)}px;font-weight:600;display:grid;place-items:center">${p==='imke'?'I':'Y'}</span>`;

const bKop=(extra='')=>`<div style="display:flex;flex-direction:column;gap:6px;padding-bottom:10px"><div style="display:flex;align-items:center;gap:8px"><b style="flex:1;font-size:17px;font-weight:600">Budgetten</b>${extra}<span style="font-size:13px;color:var(--text-muted)">dag 16 van 30</span></div>${telling}</div>`;
const verdeling=(mode='kolom')=>mode==='rij'?card(`<div style="display:grid;grid-template-columns:240px 150px minmax(0,1fr);gap:28px;align-items:center"><div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start"><span style="font-size:13px;color:var(--text-muted)">Uitgegeven in september</span><b style="font-size:32px;font-weight:600;letter-spacing:-.025em;${num}">${eur(SUM)}</b>${verschil}</div>${donut(150,15)}${legAmt(2,14)}</div>`,'24px'):card(kop(28)+`<div style="display:flex;align-items:center;gap:22px;padding-top:20px">${donut(150,15)}${legAmt(1,14).replace('gap:10px 18px','gap:9px')}</div>`);

const V3=[];

V3.push({t:'Let op / op koers',w:1000,d:'Naast elkaar, maar budgetten in twee groepen. Wat aandacht vraagt krijgt ruimte; wat op koers ligt is één regel.',h:()=>{const lo=B7s.filter(c=>st(c)!=='ok'),ok=B7s.filter(c=>st(c)==='ok');return `<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:start">${verdeling()}${card(bKop(av())+`<span style="padding:8px 0 2px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--text-subtle)">Let op</span>`+lo.map(c=>`<div style="display:flex;flex-direction:column;gap:7px;padding:10px 0"><div style="display:flex;align-items:center;gap:10px">${chip(c,28)}<span style="flex:1;font-size:15px;font-weight:500">${c.n}</span>${pill(c)}</div><div style="margin-left:38px">${tbar(c,8)}</div><span style="margin-left:38px;font-size:13px;color:var(--text-muted);${num}">${eur(c.v)} van ${eur(c.b,0)} · ${over(c)?`<b style="color:var(--danger);font-weight:600">${stTxt(c)}</b>`:stTxt(c)+', '+perDag(c)}</span></div>`).join('')+`<span style="padding:14px 0 2px;margin-top:4px;border-top:1px solid var(--border);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--text-subtle)">Op koers</span>`+ok.map(c=>`<div style="display:flex;align-items:center;gap:10px;min-height:40px">${dot(c)}<span style="flex:1;font-size:14px">${c.n}</span><span style="width:72px">${bar(c,4,{tick:false})}</span><span style="min-width:88px;text-align:right;font-size:13px;color:var(--text-muted);${num}">${stTxt(c)}</span></div>`).join(''))}</div>`}});

function sbar(c,h=6){const a=Math.min(c.v/c.b,1)*100,col=stCol(c);return `<div style="position:relative;height:${h}px;border-radius:999px;background:var(--surface-sunken)"><span style="position:absolute;left:0;top:0;bottom:0;width:${Math.max(a,1.5)}%;border-radius:999px;background:${col}"></span><span aria-hidden="true" style="position:absolute;top:50%;left:${PACE*100}%;width:${h+4}px;height:${h+4}px;margin:-${(h+4)/2}px 0 0 -${(h+4)/2}px;border-radius:999px;background:${a>=PACE*100?col:'var(--accent)'};box-shadow:0 0 0 2px var(--surface-raised)"></span></div>`}
const glyph=(c,s=24)=>`<span style="flex:0 0 auto;width:32px;display:grid;place-items:center;color:${cv(c)}">${ico(c.i,s,2)}</span>`;
