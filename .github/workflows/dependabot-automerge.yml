# Merget een Dependabot-PR voor minor of patch zodra alle andere checks
# (de CI en Vercel) groen zijn. Een rode check of een major blijft liggen.
# Alleen npm: een PR die een workflow wijzigt mag het GITHUB_TOKEN niet mergen.
name: Dependabot automerge

on: pull_request

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - name: Wacht op groene checks en merge
        if: >-
          steps.meta.outputs.package-ecosystem == 'npm_and_yarn' &&
          (steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for i in $(seq 1 80); do
            sleep 30
            # Deze job zelf telt niet mee, anders wacht hij op zichzelf.
            if ! gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" \
                --jq '[.check_runs[] | select(.name != "automerge") | {name, status, conclusion}]' > runs.json; then
              echo "Check-runs niet te lezen, opnieuw."; continue
            fi
            if ! gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/status" \
                --jq '[.statuses[] | {name: .context, state}]' > statuses.json; then
              echo "Statussen niet te lezen, opnieuw."; continue
            fi
            echo "$(jq -c '[.[] | "\(.name)=\(.conclusion // .status)"]' runs.json) $(jq -c '[.[] | "\(.name)=\(.state)"]' statuses.json)"
            if jq -e 'any(.[]; .status == "completed" and (.conclusion | IN("success", "skipped", "neutral") | not))' runs.json > /dev/null ||
               jq -e 'any(.[]; .state == "failure" or .state == "error")' statuses.json > /dev/null; then
              echo "Een check is rood, niet gemerged."
              exit 1
            fi
            if jq -e 'any(.[]; .name == "check" and .conclusion == "success") and all(.[]; .status == "completed")' runs.json > /dev/null &&
               jq -e 'all(.[]; .state == "success")' statuses.json > /dev/null; then
              gh pr merge "$PR" --squash --match-head-commit "$SHA"
              exit 0
            fi
          done
          echo "Checks niet binnen 40 minuten klaar, niet gemerged."
          exit 1
