<!-- @dsCard group="mone · Transacties" viewport="2240x1900" name="Ophalen · knopvarianten (2 gekozen)" subtitle="Gekozen: 2, status in de regel. Vijf voorstellen voor de ververs-knop in de kop van Transacties op desktop, elk in rust, bezig en klaar: stille capsule, status in de regel, alleen icoon met ring, tekstknop met lijn, laatste kaartje" -->
<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Ophalen · knopvarianten · mone.yoim</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="mone-tokens.css">
<style>body{margin:0;padding:64px;width:2112px;background:#5f5f58;font-family:var(--font-sans)}.wrap{display:grid;grid-template-columns:repeat(2,1fr);gap:48px}.opt{border-radius:28px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 24px 60px rgba(0,0,0,.28)}.in{background:var(--surface-sunken);color:var(--text);padding:36px;display:flex;flex-direction:column;gap:18px}.kop{display:flex;flex-direction:column;gap:6px}.kop p{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--text-subtle)}.kop h1{margin:0;display:flex;align-items:center;gap:12px;font-size:26px;font-weight:600;letter-spacing:-.02em}.kop h1 b{display:grid;place-items:center;width:34px;height:34px;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-size:16px}.kop span{font-size:14px;color:var(--text-muted);line-height:1.45;max-width:820px;text-wrap:pretty}.st{font-size:12px;font-weight:600;color:var(--text-subtle);padding:0 4px;margin-bottom:-10px}.scr{padding:20px;border-radius:var(--radius-lg);background:var(--canvas-wash),var(--surface);border:1px solid var(--border)}
@keyframes sp{to{transform:rotate(360deg)}}.spin{animation:sp 1s linear infinite;transform-origin:50% 50%}@keyframes pu{50%{opacity:.35}}@media (prefers-reduced-motion:reduce){.spin{animation:pu 1.6s ease-in-out infinite}}
a{color:var(--accent)}a:hover{color:var(--accent-hover)}</style>
</head><body>
<div class="wrap" id="wrap"></div>
<script>
const ACC = [['asn','ASN Yoran','€ 670,32',1],['asn','ASN Spaargeld','zonder koppeling',0],['abn','ABN AMRO Yoran & Imke','€ 2.780,16',1],['bunq','bunq Yoran','€ 15,29',0],['paypal','PayPal Yoran','€ 0,00',0]];
const NEWN = { 0:2, 3:1 };
const R = (s, spin) => `<svg ${spin ? 'class="spin"' : ''} width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;display:block"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>`;
const OK = s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;display:block"><path d="M20 6 9 17l-5-5"/></svg>`;
const logo = (b, s, off) => `<img src="banks/${b}.png" alt="" width="${s}" height="${s}" style="flex:0 0 auto;display:block;width:${s}px;height:${s}px;border-radius:${Math.round(s * .3)}px;border:1px solid var(--border);box-shadow:var(--shadow-card);box-sizing:border-box;background:var(--surface-raised);object-fit:cover;${off ? 'filter:grayscale(1);opacity:.45;' : ''}">`;
/* stand per rekening: rust | bezig (0,2 klaar; 3 bezig; rest wacht) | klaar */
const accSt = (i, s) => s === 'rust' ? null : s === 'klaar' ? 'ok' : i === 0 || i === 2 ? 'ok' : i === 3 ? 'busy' : i === 4 ? 'wait' : null;
const ring = st => st === 'wait' || st === 'busy' ? `<svg ${st === 'busy' ? 'class="spin"' : ''} width="42" height="42" viewBox="0 0 42 42" style="position:absolute;left:-5px;top:-5px"><circle cx="21" cy="21" r="19" fill="none" stroke="var(--border)" stroke-width="2"/>${st === 'busy' ? '<circle cx="21" cy="21" r="19" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="28 92"/>' : ''}</svg>` : '';
const badge = (i, st, s) => { if (st !== 'ok' || s !== 'klaar' || ACC[i][2] === 'zonder koppeling') return ''; const n = NEWN[i] || 0; return `<span style="position:absolute;right:-5px;bottom:-5px;min-width:18px;height:18px;padding:0 4px;box-sizing:border-box;border-radius:999px;display:grid;place-items:center;background:${n ? 'var(--accent)' : 'var(--surface-sunken)'};color:${n ? 'var(--accent-fg)' : 'var(--text-muted)'};border:2px solid var(--surface-raised);font-size:10px;font-weight:700;line-height:1">${n ? '+' + n : OK(10)}</span>`; };
const chips = (s, tail = '') => `<div style="display:flex;gap:${tail ? 4 : 8}px;align-items:center;margin:0 -12px;padding:0 12px">${ACC.map(([b, n, v, on], i) => { const st = ACC[i][2] === 'zonder koppeling' ? null : accSt(i, s); return `<span style="flex:0 0 auto;display:flex;align-items:center;gap:8px;height:48px;padding:0 ${tail ? 10 : 14}px 0 6px;border-radius:14px;border:1px solid ${on ? 'var(--border)' : 'transparent'};background:${on ? 'var(--surface-raised)' : 'transparent'};box-shadow:${on ? 'var(--shadow-card)' : 'none'};color:${on ? 'var(--text)' : 'var(--text-muted)'}"><span style="position:relative;width:32px;height:32px">${logo(b, 32, !on || st === 'wait')}${ring(st)}${badge(i, st, s)}</span><span style="display:flex;flex-direction:column"><span style="font-size:13px;line-height:1.25;font-weight:${on ? 600 : 500};white-space:nowrap">${n}</span><span style="font-size:12px;line-height:1.25;color:var(--text-muted);white-space:nowrap">${v}</span></span></span>`; }).join('')}${tail}</div>`;
const glass = 'position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px;padding:14px 16px 12px;border-radius:var(--radius-lg);background:var(--glass-tint-strong);border:1px solid var(--glass-border);box-shadow:var(--glass-rim),var(--shadow-card);box-sizing:border-box';
const saldo = `<b style="font-size:20px;font-weight:600;letter-spacing:-.01em;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap">€ 3.450,48</b><span style="white-space:nowrap">2 rekeningen</span>`;
const line = (meta, right = '') => `<div style="display:flex;align-items:center;gap:8px;min-height:36px"><p style="flex:1;min-width:0;margin:0;padding:0 4px;display:flex;align-items:baseline;column-gap:10px;font-size:12px;color:var(--text-muted)">${saldo}${meta}</p>${right}</div>`;
const T = { rust:'Opgehaald 16:00', bezig:'Ophalen, 2 van 4', klaar:'3 nieuw · 16:12' };

const OPTS = [
  ['Stille capsule', 'Icoon en tijd samen in één capsule rechts, zonder rand of schaduw. Rust is bijna onzichtbaar, bezig kleurt zacht groen, klaar zegt wat er nieuw is. Geen losse tijd links meer.', s => line('', `<span style="display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 12px;border-radius:999px;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;${s === 'rust' ? 'background:var(--surface-sunken);color:var(--text-muted);font-weight:500' : s === 'bezig' ? 'background:var(--accent-soft);color:var(--accent-hover);font-weight:600' : 'background:transparent;color:var(--accent-hover);font-weight:600'}">${s === 'klaar' ? OK(15) : R(15, s === 'bezig')}${T[s]}</span>`) + chips(s)],
  ['Status in de regel', 'Geen knop rechts. De tijd in de regel krijgt een klein icoon en is zelf de knop (hover: zachte achtergrond). Het rustigst: het staat waar je de tijd al leest.', s => line(`<span style="align-self:center;display:inline-flex;align-items:center;gap:6px;height:28px;margin:-4px 0;padding:0 10px 0 8px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums;${s === 'rust' ? 'color:var(--text-muted)' : 'color:var(--accent-hover);font-weight:600'};${s === 'rust' ? 'box-shadow:inset 0 0 0 1px var(--border)' : s === 'bezig' ? 'background:var(--accent-soft)' : ''}">${s === 'klaar' ? OK(13) : R(13, s === 'bezig')}${T[s]}</span>`) + chips(s)],
  ['Alleen icoon, ring als voortgang', 'Een klein icoon van 36px zonder rand rechts, met de tijd ervoor in grijs. Bezig: een dunne ring om het icoon vult per rekening (2 van 4). Klaar: een vinkje.', s => { const p = s === 'bezig' ? .5 : s === 'klaar' ? 1 : 0, C = 2 * Math.PI * 16; return line('', `<span style="font-size:12px;color:${s === 'klaar' ? 'var(--accent-hover)' : 'var(--text-muted)'};font-weight:${s === 'klaar' ? 600 : 400};font-variant-numeric:tabular-nums;white-space:nowrap">${s === 'rust' ? '16:00' : s === 'bezig' ? '2 van 4' : '3 nieuw · 16:12'}</span><span style="position:relative;width:36px;height:36px;display:grid;place-items:center;border-radius:999px;color:${s === 'rust' ? 'var(--text-muted)' : 'var(--accent)'}">${s === 'rust' ? '' : `<svg width="36" height="36" viewBox="0 0 36 36" style="position:absolute;inset:0;transform:rotate(-90deg)"><circle cx="18" cy="18" r="16" fill="none" stroke="var(--border)" stroke-width="2"/><circle cx="18" cy="18" r="16" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="${C * p} ${C}"/></svg>`}${s === 'klaar' ? OK(16) : R(16, false)}</span>`) + chips(s); }],
  ['Tekstknop met lijn', 'Rechts alleen het woord Verversen in groen, geen icoon. Bezig: een lijn van 2px onderin de kaart loopt vol per rekening. De tijd blijft links in de regel.', s => line(`<span style="white-space:nowrap;font-variant-numeric:tabular-nums;${s === 'klaar' ? 'color:var(--accent-hover);font-weight:600' : ''}">${s === 'klaar' ? T.klaar : 'Opgehaald 16:00'}</span>`, `<span style="display:inline-flex;align-items:center;height:36px;padding:0 12px;font-size:14px;font-weight:600;white-space:nowrap;color:${s === 'rust' ? 'var(--accent)' : 'var(--text-subtle)'}">${s === 'bezig' ? 'Ophalen, 2 van 4' : 'Verversen'}</span>`) + chips(s) + (s === 'bezig' ? `<span style="position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--border)"><span style="display:block;height:100%;width:50%;background:var(--accent);border-radius:0 2px 2px 0"></span></span>` : '')],
  ['Laatste kaartje', 'Verversen staat achteraan in de rij rekeningen, als een kaartje in dezelfde vorm: icoon met de tijd eronder. Zo hoort het bij de rekeningen die het ophaalt. De regel erboven blijft schoon.', s => line('') + chips(s, `<span style="flex:0 0 auto;display:flex;align-items:center;gap:6px;height:48px;padding:0 12px 0 6px;border-radius:14px;border:1px solid var(--border);background:${s === 'bezig' ? 'var(--accent-soft)' : 'transparent'};color:${s === 'rust' ? 'var(--text)' : 'var(--accent-hover)'}"><span style="width:28px;height:28px;display:grid;place-items:center">${s === 'klaar' ? OK(16) : R(16, s === 'bezig')}</span><span style="display:flex;flex-direction:column"><span style="font-size:13px;line-height:1.25;font-weight:600;white-space:nowrap">${s === 'rust' ? 'Verversen' : s === 'bezig' ? 'Ophalen' : '3 nieuw'}</span><span style="font-size:12px;line-height:1.25;color:var(--text-muted);white-space:nowrap;font-variant-numeric:tabular-nums">${s === 'rust' ? '16:00' : s === 'bezig' ? '2 van 4' : '16:12'}</span></span></span>`)]
];
document.getElementById('wrap').innerHTML = OPTS.map(([t, d, f], i) => `<div class="opt" id="k${i + 1}"><div class="in" data-thema="licht"><div class="kop"><p>Desktop · kop van Transacties</p><h1><b>${i + 1}</b>${t}</h1><span>${d}</span></div>${['rust', 'bezig', 'klaar'].map(s => `<div class="st">${s === 'rust' ? 'Rust' : s === 'bezig' ? 'Bezig' : 'Klaar'}</div><div class="scr"><div style="${glass}">${f(s)}</div></div>`).join('')}</div></div>`).join('');
</script>
</body></html>
